<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tulis deskripsi website untuk usaha atau portofolio kamu, lalu AI membuatnya. Revisi lewat teks, unduh satu file HTML."
    />
    <meta name="theme-color" content="#09090b" />
    <meta property="og:title" content="Nusa AI | Pembuat Website AI" />
    <meta
      property="og:description"
      content="Tulis deskripsi website untuk usaha atau portofolio kamu, lalu AI membuatnya. Revisi lewat teks, unduh satu file HTML."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="Nusa AI" />
    <meta name="twitter:card" content="summary" />
    <meta property="twitter:title" content="Nusa AI | Pembuat Website AI" />
    <meta
      name="twitter:description"
      content="Tulis deskripsi website untuk usaha atau portofolio kamu, lalu AI membuatnya. Revisi lewat teks, unduh satu file HTML."
    />
    <title>Nusa AI</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = stored === 'dark' || ((!stored || stored === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', isDark ? '#09090b' : '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
